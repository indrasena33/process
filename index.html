<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Pixel Pop-In & Smooth Dissolve</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: #000000; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <canvas id="animationCanvas"></canvas>

    <script>
        const canvas = document.getElementById('animationCanvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.crossOrigin = 'anonymous'; // Required to prevent canvas tainting when loading external Cloudinary images

        let pixelGrid = [];
        let imgWidth, imgHeight, offsetX, offsetY;
        const TOTAL_DURATION = 14000; 
        let startTime = null;
        const PIXEL_SIZE = 6; 

        class PixelBlock {
            constructor(x, y, r, g, b, a, appearTime) {
                this.x = x; this.y = y; this.r = r; this.g = g; this.b = b; this.a = a;
                this.appearTime = appearTime; 
            }
            draw(ctx, elapsedTime) {
                if (elapsedTime >= this.appearTime) {
                    ctx.fillStyle = `rgba(${this.r}, ${this.g}, ${this.b}, ${this.a})`;
                    ctx.fillRect(this.x, this.y, PIXEL_SIZE, PIXEL_SIZE);
                }
            }
        }

        function initGrid() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
            imgWidth = img.width * scale;
            imgHeight = img.height * scale;
            offsetX = (canvas.width - imgWidth) / 2;
            offsetY = (canvas.height - imgHeight) / 2;

            const offCanvas = document.createElement('canvas');
            offCanvas.width = canvas.width;
            offCanvas.height = canvas.height;
            const offCtx = offCanvas.getContext('2d');

            offCtx.drawImage(img, offsetX, offsetY, imgWidth, imgHeight);
            const imageData = offCtx.getImageData(0, 0, canvas.width, canvas.height).data;
            pixelGrid = [];

            for (let y = 0; y < canvas.height; y += PIXEL_SIZE) {
                for (let x = 0; x < canvas.width; x += PIXEL_SIZE) {
                    const index = (Math.floor(y) * canvas.width + Math.floor(x)) * 4;
                    const r = imageData[index];
                    const g = imageData[index + 1];
                    const b = imageData[index + 2];
                    const a = imageData[index + 3] / 255;

                    if (a > 0.1 && (r > 15 || g > 15 || b > 15)) {
                        let appearTime;
                        if (x % (PIXEL_SIZE * 3) === 0 && y % (PIXEL_SIZE * 3) === 0) {
                            appearTime = 500 + Math.random() * 3000;
                        } else if (x % (PIXEL_SIZE * 2) === 0 && y % (PIXEL_SIZE * 2) === 0) {
                            appearTime = 3000 + Math.random() * 3000;
                        } else {
                            appearTime = 5000 + Math.random() * 2500;
                        }
                        pixelGrid.push(new PixelBlock(x, y, r, g, b, a, appearTime));
                    }
                }
            }
        }

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsedTime = timestamp - startTime;

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < pixelGrid.length; i++) {
                pixelGrid[i].draw(ctx, elapsedTime);
            }

            if (elapsedTime >= 8000) {
                const fadeProgress = Math.min((elapsedTime - 8000) / 6000, 1.0);
                const easeFade = fadeProgress < 0.5 ? 2 * fadeProgress * fadeProgress : 1 - Math.pow(-2 * fadeProgress + 2, 2) / 2;

                ctx.save();
                ctx.globalAlpha = easeFade;
                ctx.drawImage(img, offsetX, offsetY, imgWidth, imgHeight);
                ctx.restore();
            }

            if (elapsedTime < TOTAL_DURATION) {
                requestAnimationFrame(animate);
            } else {
                ctx.drawImage(img, offsetX, offsetY, imgWidth, imgHeight);
            }
        }

        async function loadApp() {
            try {
                const res = await fetch('/api/latest-image');
                const data = await res.json();
                img.src = data.url ? data.url : 'krishna.png';
            } catch (err) {
                img.src = 'krishna.png';
            }

            img.onload = () => {
                initGrid();
                requestAnimationFrame((timestamp) => {
                    startTime = timestamp;
                    animate(timestamp);
                });
            };
        }

        loadApp();

        window.addEventListener('resize', () => {
            if (img.complete) {
                initGrid();
                startTime = null;
                requestAnimationFrame((timestamp) => {
                    startTime = timestamp;
                    animate(timestamp);
                });
            }
        });
    </script> 
</body>
</html>
